# ==============================================================================
# Docker Compose Triển khai Hệ thống Cổng Thông tin Thực tập TDTU
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    container_name: tdtu-internship-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=TDTU_IT_FACULTY_INTERNSHIP_SECRET_2026_KEY_SECURE_HMAC
      - DB_PATH=/app/src/data/db_cntt.sqlite
    volumes:
      # Mount lưu trữ dữ liệu SQLite vật lý ngoài host
      - ../backend/src/data:/app/src/data
    networks:
      - tdtu-portal-network

  # Nginx phục vụ Frontend nếu tách biệt container (hoặc Backend tự serve static SPA)
  frontend:
    image: nginx:alpine
    container_name: tdtu-internship-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - tdtu-portal-network

networks:
  tdtu-portal-network:
    driver: bridge
