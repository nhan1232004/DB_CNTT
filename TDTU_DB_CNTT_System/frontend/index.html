  <!-- DevTools & Source Protection Guard (Bảo vệ an toàn thông tin & chống lộ mã nguồn F12) -->
  <script>
    (function() {
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
          return false;
        }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
          e.preventDefault();
          return false;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) {
          e.preventDefault();
          return false;
        }
      }, false);

      document.addEventListener('contextmenu', function(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          return true;
        }
        e.preventDefault();
        return false;
      }, false);
    })();
  </script>

  <!-- Resilient App Mounter (Thread-safe Singleton) -->
  <script>
    (function() {
      var isMounted = false;
      function tryMount() {
        if (isMounted) return;
        if (window.App && window.ReactDOM && window.React) {
          var rootElem = document.getElementById('root');
          if (rootElem) {
            isMounted = true;
            rootElem.innerHTML = '';
            var root = ReactDOM.createRoot(rootElem);
            root.render(React.createElement(window.App));
            console.log('[TDTU Portal]: React App mounted successfully (Singleton).');
            return;
          }
        }
        setTimeout(tryMount, 40);
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        tryMount();
      } else {
        window.addEventListener('DOMContentLoaded', tryMount, { once: true });
        window.addEventListener('load', tryMount, { once: true });
      }
    })();
  </script>
