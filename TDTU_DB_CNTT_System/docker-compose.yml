version: '3.8'

services:
  tdtu-internship-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tdtu_db_cntt_system
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=TDTU_IT_FACULTY_INTERNSHIP_SECRET_2026_KEY_SECURE_HMAC
    volumes:
      - ./backend/src/data:/app/backend/src/data
    restart: unless-stopped
