# ============================================================================
# DOCKER COMPOSE: DB_CNTT Hệ Thống Quản Lý Thực Tập & Tập Sự Nghề Nghiệp TDTU
# App Gateway Server (Node 24 + SQLite)
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db_cntt_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/TDTU_DB_CNTT_System/backend/src/data/db_cntt.sqlite
    volumes:
      - sqlite_data:/app/TDTU_DB_CNTT_System/backend/src/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/students/summary']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
